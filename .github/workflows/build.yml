name: build-and-push

# Builds the 32-bit ARMv7 image the iHost needs and pushes it to GHCR.
# You do not need Docker on your own machine for this -- push to GitHub and
# the image appears at ghcr.io/<your-user>/ihost-sensorlog:latest.
#
# One-time setup after the first run:
#   GitHub -> your profile -> Packages -> ihost-sensorlog -> Package settings
#   -> Change visibility -> Public      (so the iHost can pull it without login)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ihost-sensorlog
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # armv7 is what the iHost needs; arm64/amd64 are a convenience so
          # you can run the identical image on a NAS or Pi for testing.
          platforms: linux/arm/v7,linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
